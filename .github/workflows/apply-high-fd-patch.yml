name: Validate high-fd fix

on:
  push:
    branches:
      - tmp/apply-high-fd-patch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ea3b0baa56d5d06c8210fe72343b3ee02dc1c33
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex gcc g++ git libprotobuf-dev libnl-route-3-dev libtool make pkg-config protobuf-compiler
      - name: Build
        run: |
          make clean
          make -j2
